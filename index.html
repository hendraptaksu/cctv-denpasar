<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CCTV ATCS Denpasar — Viewer + Peta SPBU</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<style>
  :root { --bg:#0f141b; --card:#1a2230; --card2:#222d42; --txt:#eef2f7; --mut:#9aa7bd; --acc:#2f81f7; --ok:#2ea043; --bad:#f85149; --warn:#d29922; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--txt); }
  header { position:sticky; top:0; z-index:20; background:rgba(15,20,27,.95); backdrop-filter:blur(8px); border-bottom:1px solid #2a3648; }
  .wrap { max-width:1400px; margin:0 auto; padding:14px 16px; }
  h1 { font-size:20px; margin:0 0 2px; }
  .toolbar { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; align-items:center; }
  input[type=search], select { padding:10px 12px; border-radius:8px; border:1px solid #2a3648; background:#0d131c; color:var(--txt); font-size:14px; }
  select { flex:1; min-width:170px; }
  label.chk { display:flex; align-items:center; gap:6px; font-size:14px; color:var(--txt); background:var(--card2); border:1px solid #2a3648; border-radius:8px; padding:9px 12px; cursor:pointer; }
  button { padding:10px 14px; border-radius:8px; border:1px solid #2a3648; background:var(--card2); color:var(--txt); cursor:pointer; font-size:14px; }
  button:hover { background:#2c3a55; }
  button.primary { background:var(--acc); border-color:var(--acc); }
  button.danger { background:#5a1f1f; border-color:var(--bad); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .tabs { display:flex; gap:6px; flex-shrink:0; margin-left:auto; }
  .tabs button.on { background:var(--acc); border-color:var(--acc); }
  #grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(330px,1fr)); gap:14px; padding:16px; max-width:1400px; margin:0 auto; }
  #grid.hide { display:none; }
  .card { background:var(--card); border:1px solid #2a3648; border-radius:12px; overflow:hidden; display:flex; flex-direction:column; }
  .view { position:relative; aspect-ratio:16/9; background:#000; }
  .view video, .view iframe { position:absolute; inset:0; width:100%; height:100%; border:0; }
  .placeholder { position:absolute; inset:0; display:flex; flex-direction:column; gap:8px; align-items:center; justify-content:center; color:var(--mut); padding:12px; text-align:center; }
  .badge { position:absolute; top:8px; left:8px; font-size:11px; font-weight:700; padding:3px 9px; border-radius:99px; background:#333; z-index:2; }
  .badge.live { background:var(--bad); } .badge.ready { background:var(--ok); } .badge.off { background:var(--warn); color:#000; }
  .meta { padding:10px 12px; }
  .meta h3 { margin:0 0 2px; font-size:15px; }
  .meta p { margin:0 0 4px; font-size:12.5px; color:var(--mut); }
  .meta .spbu { font-size:12.5px; color:#ffb86b; margin:0 0 8px; }
  .row { display:flex; gap:6px; flex-wrap:wrap; }
  .row button { padding:7px 10px; font-size:13px; }
  .small { font-size:12px; color:var(--mut); word-break:break-all; margin-top:6px; }
  #mapWrap { display:none; max-width:1400px; margin:0 auto; padding:16px; position:relative; z-index:0; /* jebak z-index internal Leaflet (s/d 1000) di bawah sticky header */ }
  #mapWrap.show { display:block; }
  #map { height:calc(100vh - 340px); min-height:420px; border-radius:12px; border:1px solid #2a3648; }
  .legend { display:flex; gap:14px; flex-wrap:wrap; font-size:13px; color:var(--mut); margin-top:8px; }
  #modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.92); z-index:1000; align-items:center; justify-content:center; padding:20px; }
  #modal.open { display:flex; }
  #modalBox { width:min(1100px,100%); }
  #modal video { width:100%; max-height:78vh; background:#000; border-radius:8px; display:block; }
  #modalStage { position:relative; }
  #modalStatus { position:absolute; inset:0; display:flex; flex-direction:column; gap:12px; align-items:center; justify-content:center; background:rgba(0,0,0,.72); border-radius:8px; text-align:center; padding:16px; }
  #modalStatus[hidden] { display:none; }
  #modalStatus .spin { width:44px; height:44px; border:4px solid rgba(255,255,255,.25); border-top-color:#fff; border-radius:50%; animation:mspin .9s linear infinite; }
  #modalStatus.err .spin { display:none; }
  #modalStatusTxt { font-size:15px; }
  #modalLive { position:absolute; top:10px; left:10px; font-size:11px; font-weight:700; padding:3px 9px; border-radius:99px; background:var(--bad); }
  #modalLive[hidden] { display:none; }
  @keyframes mspin { to { transform:rotate(360deg); } }
  #status { padding:0 16px 16px; max-width:1400px; margin:0 auto; color:var(--mut); font-size:13px; }
  .titleRow { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  #q { flex:1 1 auto; min-width:170px; max-width:440px; }
  .sub { color:var(--mut); font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:330px; flex-shrink:0; }
  #panelToggle { display:inline-flex; position:relative; white-space:nowrap; flex-shrink:0; }
  #panel:not(.open) { display:none; }
  .row button { padding:6px 9px; font-size:12.5px; }
  .meta .loc { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #panelToggle.hasFilter::after { content:""; position:absolute; top:5px; right:5px; width:9px; height:9px; border-radius:50%; background:var(--warn); }
  #pinChip { display:flex; align-items:center; gap:8px; margin-top:8px; padding:8px 12px; border-radius:8px; background:rgba(210,153,34,.15); border:1px solid var(--warn); font-size:13px; }
  #pinChip[hidden] { display:none; }
  #pinChip button { padding:4px 10px; font-size:12px; margin-left:auto; white-space:nowrap; }
  @media (max-width:720px) {
    .wrap { padding:10px 12px; }
    .sub { font-size:12px; }
    #panelToggle { padding:8px 12px; font-size:13px; }
    #q { min-width:0; }
    #panel .toolbar button, #panel label.chk { font-size:13px; padding:8px 10px; }
    .titleRow .tabs { flex-basis:100%; order:3; margin-top:8px; margin-left:0; }
    #count { flex-basis:100%; order:4; margin-top:2px; max-width:none; }
    .tabs button { flex:1; padding:8px 6px; font-size:13px; }
    #grid { grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:10px; padding:10px; }
    #mapWrap { padding:10px; }
    #map { height:calc(100vh - 230px); min-height:340px; }
    #modal { padding:10px; }
  }
  .leaflet-popup-content { color:#111; font-size:13px; }
  .leaflet-popup-content button { padding:6px 10px; font-size:13px; background:#2f81f7; color:#fff; border:0; margin-top:6px; }
  .leaflet-popup-content button:disabled { background:#888; opacity:.6; cursor:not-allowed; }
  .mk-cctv, .mk-spbu, .mk-bali { font-size:20px; line-height:1; text-align:center; position:relative; }
  .mk-n { position:absolute; top:-9px; right:-12px; background:var(--acc); color:#fff; font-size:11px; font-weight:700; border-radius:99px; padding:0 5px; line-height:1.6; }
  .meta .src { display:inline-block; font-size:11px; font-weight:700; padding:2px 8px; border-radius:99px; background:#2c3a55; margin-bottom:6px; }
  .meta .src.bali { background:#5b2d8e; }
  a { color:var(--acc); }
</style>
</head>
<body>
<header><div class="wrap">
  <div class="titleRow">
    <input type="search" id="q" placeholder="Cari lokasi CCTV… (cth: Teuku Umar)">
    <div class="sub" id="count">Memuat…</div>
    <div class="tabs">
      <button id="tabGrid">🖼 Grid Kamera</button>
      <button id="tabMap" class="on">🗺 Peta CCTV + SPBU</button>
    </div>
    <button id="panelToggle" aria-expanded="false" aria-controls="panel">☰ Filter</button>
  </div>
  <div id="panel">
  <div class="toolbar">
    <select id="srcSel" title="Sumber CCTV">
      <option value="all">📡 Semua sumber</option>
      <option value="denpasar">📷 ATCS Denpasar</option>
      <option value="bali">📹 Bali Provinsi</option>
    </select>
    <select id="spbuSel" title="Filter berdasarkan SPBU"><option value="all">⛽ Semua SPBU</option></select>
    <select id="radiusSel" title="Radius dari SPBU">
      <option value="0.5">≤ 0,5 km dari SPBU</option>
      <option value="1" selected>≤ 1 km dari SPBU</option>
      <option value="2">≤ 2 km dari SPBU</option>
      <option value="3">≤ 3 km dari SPBU</option>
    </select>
    <label class="chk"><input type="checkbox" id="nearOnly"> CCTV dekat SPBU saja</label>
  </div>
  <div class="toolbar">
    <button id="refresh">⟳ Refresh daftar</button>
    <button id="playVisible" class="primary">▶ Putar yang tampil</button>
    <button id="stopAll" class="danger">⏹ Stop semua</button>
    <button id="checkBtn">📡 Cek status</button>
  </div>
  </div>
  <div id="pinChip" hidden>
    <span id="pinChipTxt"></span>
    <button id="pinClear" title="Lepas pin, tampilkan semua">✕ Lepas</button>
  </div>
</div></header>

<div id="grid" class="hide"></div>
<div id="mapWrap" class="show">
  <div id="map"></div>
  <div class="legend"><span>📷 CCTV ATCS Denpasar</span><span>📹 CCTV Bali Provinsi</span><span>⛽ SPBU (data OpenStreetMap — klik marker untuk CCTV terdekat)</span></div>
</div>
<div id="status"></div>

<div id="modal"><div id="modalBox">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px">
    <div style="min-width:0"><div id="modalTitle" style="font-weight:700"></div><div id="modalSub" class="sub"></div></div>
    <button id="modalClose">✕ Tutup</button>
  </div>
  <div id="modalStage">
    <video id="modalVideo" controls autoplay muted playsinline></video>
    <div id="modalStatus">
      <div class="spin"></div>
      <div id="modalStatusTxt">Menghubungkan…</div>
      <div id="modalStatusBtns" hidden><button id="modalRetry" class="primary">🔄 Coba lagi</button></div>
    </div>
    <div id="modalLive" hidden>● LIVE</div>
  </div>
</div></div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.10"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
"use strict";
const API = "https://atcs.denpasarkota.go.id/api/v3/pv/ldevice?orderBy=id_lokasi&sortedBy=asc";
const HEADERS = { "x-client-id": "a194e6ae-d4dd-4b62-a0ac-388922f09303", "x-client-secret": "f430fde38a031fb657a2a7d6f84644a9aed767a4c22314d4b7c565648acc2396" };
const BALI_API = "https://balisatudata.baliprov.go.id/api/v1/report-cctv";
const BALI_HLS = "https://transcode.baliprov.go.id/cctv/";
const BALI_PLAYER = "https://transcode.baliprov.go.id/cctv-player.html?id=";
let cams = [];   // + {nearSpbu, nearDist}
let spbus = [];  // {id,name,lat,lon,addr}
let spbuPin = null; // {id, ids[]} — daftar persis dari popup SPBU via "Tampilkan di grid"
const players = new Map();

function norm(s){ return (s||"").toLowerCase(); }
function hav(a,b,c,d){ // km
  const R=6371, r=Math.PI/180;
  const h=Math.sin((c-a)*r/2)**2 + Math.cos(a*r)*Math.cos(c*r)*Math.sin((d-b)*r/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
function fmtKm(km){ return km < 1 ? Math.round(km*1000)+" m" : km.toFixed(1).replace(".",",")+" km"; }
function setStatus(t){ document.getElementById("status").textContent = t || ""; }
function esc(s){ return String(s ?? "").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }
function camTitle(c){ return c.nama_alias || c.nama || c.nama_lokasi; }

async function loadLive() {
  const r = await fetch(API, { headers: HEADERS });
  if (!r.ok) throw new Error("API " + r.status);
  const j = await r.json();
  const out = [];
  for (const loc of (j.data || [])) {
    for (const dev of (loc.tb_device_lokasi || [])) {
      let url = (dev.url_proxy_hls || "").trim();
      if (!url) continue;
      if (!url.endsWith("/")) url += "/";
      out.push({
        id_lokasi: loc.id_lokasi, nama_lokasi: loc.nama_lokasi, ket_lokasi: loc.ket_lokasi,
        lat: loc.lat_lokasi, lon: loc.lon_lokasi,
        nama: dev.nama, nama_alias: dev.nama_alias,
        stream_page: url, hls: url + "index.m3u8",
        poster: dev.poster ? "https://atcs.denpasarkota.go.id/poster/" + dev.poster : null
      });
    }
  }
  return out;
}

function mapBaliCam(r) {
  const lat = parseFloat(r.lat), lon = parseFloat(r.lng);
  if (!isFinite(lat) || !isFinite(lon) || !r.ch_id) return null;
  return {
    id_lokasi: "bali-" + r.cctv_id, nama_lokasi: r.ch_name, ket_lokasi: "CCTV Provinsi Bali (Bali Satu Data)",
    lat, lon, nama: r.ch_name, nama_alias: r.ch_name,
    stream_page: r.streaming_url || (BALI_PLAYER + r.ch_id),
    hls: BALI_HLS + r.ch_id + "/index.m3u8",
    poster: null, source: "bali",
  };
}

async function loadBaliLive() {
  const r = await fetch(BALI_API);
  if (!r.ok) throw new Error("API Bali " + r.status);
  const j = await r.json();
  return Object.values(j.data || {}).map(mapBaliCam).filter(Boolean);
}

async function loadSpbu() {
  try {
    const r = await fetch("spbu.json");
    if (r.ok) { spbus = await r.json(); return; }
  } catch {}
  spbus = [];
}

function computeNearest() {
  for (const c of cams) {
    let best = null, bd = Infinity;
    for (const s of spbus) {
      if (c.lat == null || s.lat == null) continue;
      const d = hav(c.lat, c.lon, s.lat, s.lon);
      if (d < bd) { bd = d; best = s; }
    }
    c.nearSpbu = best; c.nearDist = bd;
  }
}

function fillSpbuSelect() {
  const sel = document.getElementById("spbuSel");
  sel.innerHTML = '<option value="all">⛽ Semua SPBU</option>';
  [...spbus].sort((a,b) => a.name.localeCompare(b.name)).forEach(s => {
    const o = document.createElement("option");
    o.value = s.id; o.textContent = `⛽ ${s.name}`;
    sel.appendChild(o);
  });
}

async function load() {
  setStatus("Mengambil daftar CCTV dari server…");
  let den = [], bal = [];
  const notes = [];
  try { den = await loadLive(); }
  catch (e) {
    console.warn(e);
    try { den = await (await fetch("cctvs.json")).json(); notes.push("ATCS Denpasar: snapshot lokal"); }
    catch { notes.push("ATCS Denpasar gagal dimuat"); }
  }
  try { bal = await loadBaliLive(); }
  catch (e) {
    console.warn(e);
    try { bal = await (await fetch("cctv-bali.json")).json(); notes.push("Bali Prov: snapshot lokal"); }
    catch { notes.push("Bali Prov gagal dimuat"); }
  }
  den.forEach(c => { c.source = "denpasar"; });
  bal.forEach(c => { if (!c.source) c.source = "bali"; });
  cams = [...den, ...bal];
  if (!cams.length) { setStatus("Gagal memuat semua sumber CCTV."); return; }
  await loadSpbu();
  computeNearest();
  fillSpbuSelect();
  const n = cams.filter(c => c.nearDist <= 1).length;
  setStatus(`Live: ${den.length} ATCS Denpasar + ${bal.length} Bali Prov. ${spbus.length} SPBU, ${n}/${cams.length} kamera dalam 1 km SPBU.` + (notes.length ? " (" + notes.join("; ") + ")" : ""));
  markersDirty = true;
  spbuPin = null; // indeks kamera bisa bergeser setelah reload
  render();
  showTab("map"); // peta = tampilan default
}

// --- filter ---
function filtered() {
  const q = norm(document.getElementById("q").value);
  const spbuId = document.getElementById("spbuSel").value;
  const radius = parseFloat(document.getElementById("radiusSel").value);
  const nearOnly = document.getElementById("nearOnly").checked;
  const sel = spbus.find(s => s.id === spbuId);
  const src = document.getElementById("srcSel").value;
  let ids = cams.map((_, i) => i);
  if (q) ids = ids.filter(i => {
    const c = cams[i];
    return norm(c.nama_lokasi).includes(q) || norm(c.nama_alias).includes(q) || norm(c.nama).includes(q) || norm(c.ket_lokasi).includes(q);
  });
  if (src !== "all") ids = ids.filter(i => (cams[i].source || "denpasar") === src);
  if (sel) {
    if (spbuPin && spbuPin.id === spbuId) {
      // mode pin: grid/peta menampilkan PERSIS daftar dari popup SPBU (urutan jarak),
      // diiris pencarian teks
      ids = spbuPin.ids.filter(i => ids.includes(i));
      return { ids, sel, radius, pinned: true };
    }
    ids = ids.map(i => ({ i, d: hav(cams[i].lat, cams[i].lon, sel.lat, sel.lon) }))
             .filter(({ d }) => d <= radius)
             .sort((a,b) => a.d - b.d)
             .map(({ i }) => i);
  } else if (nearOnly) {
    ids = ids.filter(i => cams[i].nearDist <= radius);
  }
  return { ids, sel, radius, pinned: false };
}

// --- video ---
function attachStream(video, hlsUrl, cbs) {
  // cbs: {onFatal(data), onRetry(attempt, max)} — retry otomatis spt situs aslinya
  const MAX_RETRY = 3, RETRY_DELAY = 2000;
  const onFatal = cbs && cbs.onFatal, onRetry = cbs && cbs.onRetry;
  if (video.canPlayType("application/vnd.apple.mpegurl")) {
    let attempt = 0, dead = false, timer = null;
    const onErr = () => {
      if (dead) return;
      attempt++;
      if (attempt <= MAX_RETRY) {
        onRetry && onRetry(attempt, MAX_RETRY);
        timer = setTimeout(() => { if (!dead) { video.src = hlsUrl; video.play().catch(() => {}); } }, RETRY_DELAY);
      } else {
        onFatal && onFatal();
      }
    };
    video.addEventListener("error", onErr);
    video.src = hlsUrl;
    video.play().catch(() => {});
    return { destroy() { dead = true; if (timer) clearTimeout(timer); video.removeEventListener("error", onErr); video.removeAttribute("src"); video.load(); } };
  }
  if (!(window.Hls && Hls.isSupported())) {
    video.src = hlsUrl; // last resort
    return { destroy() {} };
  }
  let hls = null, dead = false, attempt = 0, recovered = false, timer = null;
  function cleanupHls() { try { hls && hls.destroy(); } catch {} hls = null; }
  function start() {
    if (dead) return;
    recovered = false;
    hls = new Hls({
      maxLiveSyncPlaybackRate: 1.5,
      manifestLoadingMaxRetry: 2, levelLoadingMaxRetry: 3, fragLoadingMaxRetry: 4,
    });
    hls.on(Hls.Events.ERROR, (evt, data) => {
      if (!data || !data.fatal || dead) return;
      if (data.type === Hls.ErrorTypes.MEDIA_ERROR && !recovered) {
        recovered = true;
        try { hls.recoverMediaError(); return; } catch {}
      }
      attempt++;
      if (attempt <= MAX_RETRY) {
        onRetry && onRetry(attempt, MAX_RETRY);
        cleanupHls();
        timer = setTimeout(start, RETRY_DELAY);
      } else {
        cleanupHls();
        onFatal && onFatal(data);
      }
    });
    hls.loadSource(hlsUrl);
    hls.attachMedia(video);
    video.play().catch(() => {});
  }
  start();
  return {
    destroy() {
      dead = true;
      if (timer) clearTimeout(timer);
      cleanupHls();
      try { video.removeAttribute("src"); video.load(); } catch {}
    }
  };
}
function playInto(idx) {
  stopOne(idx);
  const card = document.querySelector(`[data-idx="${idx}"]`);
  if (!card) return;
  const view = card.querySelector(".view");
  const cam = cams[idx];
  view.querySelector(".placeholder")?.remove();
  view.querySelector("video")?.remove();
  const v = document.createElement("video");
  v.controls = true; v.muted = true; v.autoplay = true; v.playsInline = true;
  view.prepend(v);
  const badge = card.querySelector(".badge");
  players.set(idx, { video: v, hls: attachStream(v, cam.hls, {
    onFatal: () => setBadge(badge, "off", "OFFLINE"),
    onRetry: (a, m) => setBadge(badge, "", "RETRY " + a + "/" + m),
  }) });
  v.addEventListener("playing", () => setBadge(badge, "live", "● LIVE"));
  v.addEventListener("error", () => setBadge(badge, "off", "OFFLINE"), true);
  card.querySelector("[data-act=play]").textContent = "⏹ Stop";
}
function stopOne(idx) {
  const p = players.get(idx);
  if (p) { try { p.hls && p.hls.destroy(); } catch {} p.video?.remove(); players.delete(idx); }
  const card = document.querySelector(`[data-idx="${idx}"]`);
  if (card && !card.querySelector("video")) {
    const b = card.querySelector("[data-act=play]");
    if (b) b.textContent = "▶ Putar";
  }
}
function setBadge(el, cls, txt) { if (el) { el.className = "badge " + cls; el.textContent = txt; } }
function restorePlaceholder(idx) {
  const card = document.querySelector(`[data-idx="${idx}"]`);
  if (!card || card.querySelector(".placeholder") || card.querySelector("video")) return;
  const d = document.createElement("div");
  d.className = "placeholder";
  d.innerHTML = `<div style="font-size:34px">📷</div><div>Klik <b>Putar</b> untuk streaming</div>`;
  card.querySelector(".view").appendChild(d);
}

// --- grid ---
function render() {
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  for (const k of [...players.keys()]) stopOne(k);
  const { ids, sel, radius, pinned } = filtered();
  const hasFilter = document.getElementById("q").value.trim() !== "" || !!sel || document.getElementById("nearOnly").checked || document.getElementById("srcSel").value !== "all";
  document.getElementById("panelToggle").classList.toggle("hasFilter", hasFilter);
  const nDen = cams.filter(c => (c.source || "denpasar") !== "bali").length;
  const extra = sel ? (pinned ? ` • 📌 ${ids.length} sesuai daftar popup ${sel.name} (ubah filter SPBU untuk lepas)` : ` • ≤ ${fmtKm(radius)} dari ${sel.name}`) : "";
  document.getElementById("count").textContent = `${cams.length} kamera (${nDen} Denpasar + ${cams.length - nDen} Bali) • ${spbus.length} SPBU • menampilkan ${ids.length}${extra}`;
  document.getElementById("count").title = document.getElementById("count").textContent;
  const chip = document.getElementById("pinChip");
  if (pinned && sel) {
    chip.hidden = false;
    document.getElementById("pinChipTxt").textContent = `📌 ${ids.length} CCTV sesuai popup ${sel.name}`;
  } else {
    chip.hidden = true;
  }
  for (const idx of ids) {
    const c = cams[idx];
    const d = sel ? hav(c.lat, c.lon, sel.lat, sel.lon) : c.nearDist;
    const sName = sel ? sel.name : (c.nearSpbu ? c.nearSpbu.name : null);
    const card = document.createElement("div");
    card.className = "card"; card.dataset.idx = idx;
    card.innerHTML = `
      <div class="view">
        <span class="badge">IDLE</span>
        <div class="placeholder">
          <div style="font-size:34px">📷</div>
          <div>Klik <b>Putar</b> untuk streaming</div>
        </div>
      </div>
      <div class="meta">
        <span class="src${c.source === "bali" ? " bali" : ""}">${c.source === "bali" ? "📹 BALI PROV" : "📷 ATCS DPS"}</span>
        <h3>${esc(camTitle(c))}</h3>
        <p class="loc" title="${esc((c.nama_lokasi || "") + " — " + (c.ket_lokasi || ""))}">${esc(c.nama_lokasi || "")} — ${esc(c.ket_lokasi || "")}</p>
        ${sName && isFinite(d) ? `<p class="spbu">⛽ ${fmtKm(d)} ke ${esc(sName)}</p>` : ""}
        <div class="row">
          <button data-act="play" class="primary">▶ Putar</button>
          <button data-act="full">⛶ Fullscreen</button>
          <button data-act="map">🗺 Peta</button>
          <button data-act="copy" title="Salin URL HLS (klik untuk menyalin)">🔗 Copy URL</button>
        </div>
      </div>`;
    card.querySelector("[data-act=play]").onclick = () => {
      players.has(idx) ? (stopOne(idx), restorePlaceholder(idx), setBadge(card.querySelector(".badge"), "", "IDLE"))
                       : playInto(idx);
    };
    card.querySelector("[data-act=full]").onclick = () => openModal(idx);
    card.querySelector("[data-act=map]").onclick = () => { showTab("map"); focusCam(idx); };
    card.querySelector("[data-act=copy]").onclick = async (e) => {
      await navigator.clipboard.writeText(c.hls).catch(() => {});
      e.target.textContent = "✓ Tersalin";
      setTimeout(() => e.target.textContent = "🔗 Copy URL", 1200);
    };
    grid.appendChild(card);
  }
  syncMapToFilter(); // marker peta selalu ikut filter header
}

// --- modal ---
let modalHls = null, modalIdx = null, modalTimer = null, modalEverPlayed = false;
function setModalStatus(mode, txt) {
  const st = document.getElementById("modalStatus");
  if (!mode) { st.hidden = true; return; }
  st.hidden = false;
  st.classList.toggle("err", mode === "error");
  document.getElementById("modalStatusTxt").textContent = txt || "";
  document.getElementById("modalStatusBtns").hidden = mode !== "error";
}
function modalFail(msg) {
  if (modalTimer) { clearTimeout(modalTimer); modalTimer = null; }
  if (modalIdx != null) statusCache[modalIdx] = { state: "offline", t: Date.now() };
  document.getElementById("modalLive").hidden = true;
  setModalStatus("error", msg || "Gagal memuat stream — kamera kemungkinan offline.");
}
function openModal(idx) {
  const c = cams[idx];
  modalIdx = idx; modalEverPlayed = false;
  document.getElementById("modalTitle").textContent = camTitle(c);
  document.getElementById("modalSub").textContent =
    (c.source === "bali" ? "📹 Bali Prov" : "📷 ATCS Denpasar") + " • " +
    [c.nama_lokasi, c.ket_lokasi].filter(Boolean).join(" — ") +
    (c.nearSpbu && isFinite(c.nearDist) ? ` • ⛽ ${fmtKm(c.nearDist)} ke ${c.nearSpbu.name}` : "");
  document.getElementById("modal").classList.add("open");
  document.getElementById("modalLive").hidden = true;
  setModalStatus("loading", "Menghubungkan ke kamera…");
  const v = document.getElementById("modalVideo");
  try { modalHls && modalHls.destroy(); } catch {}
  if (modalTimer) clearTimeout(modalTimer);
  modalTimer = setTimeout(() => modalFail("Kamera tidak merespons dalam 20 detik — kemungkinan offline."), 20000);
  v.onwaiting = () => { if (modalEverPlayed) setModalStatus("loading", "Buffering…"); };
  v.onstalled = () => { if (modalEverPlayed) setModalStatus("loading", "Buffering…"); };
  v.onplaying = () => {
    modalEverPlayed = true;
    if (modalTimer) { clearTimeout(modalTimer); modalTimer = null; }
    statusCache[idx] = { state: "online", t: Date.now() };
    setModalStatus(null);
    document.getElementById("modalLive").hidden = false;
  };
  v.onerror = () => modalFail();
  modalHls = attachStream(v, c.hls, {
    onFatal: () => modalFail(),
    onRetry: (a, m) => setModalStatus("loading", `Menghubungkan ulang (${a}/${m})…`),
  });
}
window.openModal = openModal; // dipakai popup peta
function closeModal() {
  document.getElementById("modal").classList.remove("open");
  if (modalTimer) { clearTimeout(modalTimer); modalTimer = null; }
  const v = document.getElementById("modalVideo");
  v.onwaiting = v.onstalled = v.onplaying = v.onerror = null;
  try { modalHls && modalHls.destroy(); } catch {}
  modalHls = null; modalIdx = null; modalEverPlayed = false;
  v.removeAttribute("src"); v.load();
  setModalStatus(null);
  document.getElementById("modalLive").hidden = true;
}
document.getElementById("modalRetry").onclick = () => { if (modalIdx != null) openModal(modalIdx); };
document.getElementById("modalClose").onclick = closeModal;
document.getElementById("modal").addEventListener("click", e => { if (e.target.id === "modal") closeModal(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

// --- status stream (dipakai popup SPBU & tombol Cek status) ---
const statusCache = {}; // idx -> {state:"online"|"offline", t:timestamp}
async function checkCamStatus(idx) {
  const now = Date.now();
  const hit = statusCache[idx];
  if (hit && now - hit.t < 5*60*1000) return hit.state;
  let state = "offline";
  try {
    const r = await fetch(cams[idx].hls, { cache: "no-store" });
    if (r.ok) state = "online";
  } catch { state = "offline"; }
  statusCache[idx] = { state, t: now };
  return state;
}
function spbuNearby(s, maxKm = 1, maxN = 8) {
  return cams.map((c, idx) => ({ c, idx, d: hav(c.lat, c.lon, s.lat, s.lon) }))
    .filter(({ d }) => d <= maxKm).sort((a,b) => a.d - b.d).slice(0, maxN);
}
function spbuPopupHtml(s, states) {
  const nearby = spbuNearby(s);
  const rank = st => st === "online" ? 0 : st === "offline" ? 2 : 1;
  nearby.sort((a,b) => (rank(states[a.idx]) - rank(states[b.idx])) || (a.d - b.d));
  const list = nearby.length ? "<br>" + nearby.map(({ c, idx, d }) => {
    const st = states[idx];
    if (st === "offline") return `<span style="color:#999">• ${fmtKm(d)} — ${esc(camTitle(c))} (offline)</span>`;
    const wait = st ? "" : " ⏳";
    return `• ${fmtKm(d)} — <a href="#" onclick="openModal(${idx});return false">${esc(camTitle(c))}</a>${wait}`;
  }).join("<br>") : "<br><i>Belum ada CCTV dalam 1 km.</i>";
  return `<b>⛽ ${esc(s.name)}</b><br>${esc(s.addr || "")}<br><b>CCTV terdekat (≤1 km):</b>${list}<br><button onclick="filterBySpbu('${s.id}')"${nearby.length ? "" : " disabled"}>Tampilkan di grid</button>`;
}

// --- peta (Leaflet) ---
let map = null, cctvLayer = null, spbuLayer = null, radiusCircle = null;
const groupMarkerByKey = {}, spbuMarkerById = {};
let locGroups = []; // [{key, lat, lon, label, idxs:[]}]
let markersDirty = true;
function initMap() {
  if (map || !window.L) return false;
  map = L.map("map").setView([-8.67, 115.21], 12);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19, attribution: "© OpenStreetMap"
  }).addTo(map);
  cctvLayer = (L.markerClusterGroup
    ? L.markerClusterGroup({ showCoverageOnHover: false, maxClusterRadius: 45, disableClusteringAtZoom: 16 })
    : L.layerGroup()).addTo(map);
  spbuLayer = L.layerGroup().addTo(map);
  return true;
}
// Popup satu titik: 1 kamera -> detail penuh; >1 kamera -> daftar pilihan + status.
function groupPopupHtml(g, list, states) {
  if (list.length === 1) {
    const idx = list[0], c = cams[idx];
    const near = c.nearSpbu && isFinite(c.nearDist)
      ? `<br>⛽ Terdekat: ${esc(c.nearSpbu.name)} (${fmtKm(c.nearDist)})` : "";
    return `<b>${esc(camTitle(c))}</b><br>${c.source === "bali" ? "📹 CCTV Provinsi Bali" : "📷 CCTV ATCS Denpasar"}<br>${esc(c.nama_lokasi || "")} — ${esc(c.ket_lokasi || "")}${near}<br><button onclick="openModal(${idx})">▶ Putar CCTV</button>`;
  }
  const rows = list.map(idx => {
    const c = cams[idx];
    const tag = c.source === "bali" ? "📹" : "📷";
    if (states[idx] === "offline") return `<div>${tag} ${esc(camTitle(c))} <span style="color:#999">(offline)</span></div>`;
    const wait = states[idx] ? "" : " ⏳";
    return `<div>${tag} <a href="#" onclick="openModal(${idx});return false">${esc(camTitle(c))}</a>${wait}</div>`;
  }).join("");
  return `<b>${list.length} kamera di titik ini</b><br>${esc(g.label)}<br>${rows}`;
}
// Bangun objek marker sekali saja (isi popup ikut data terbaru); tampil/sembunyi diatur syncMapToFilter().
// Kamera se-titik dikelompokkan: satu ikon, popup berisi daftar pilihan.
function ensureMarkersBuilt() {
  if (!window.L || !markersDirty) return;
  Object.keys(groupMarkerByKey).forEach(k => delete groupMarkerByKey[k]);
  Object.keys(spbuMarkerById).forEach(k => delete spbuMarkerById[k]);
  locGroups = [];
  const byKey = {};
  cams.forEach((c, idx) => {
    if (c.lat == null) return;
    const key = c.lat.toFixed(5) + "," + c.lon.toFixed(5);
    if (!byKey[key]) {
      byKey[key] = { key, lat: c.lat, lon: c.lon, label: c.nama_lokasi || camTitle(c), idxs: [] };
      locGroups.push(byKey[key]);
    }
    byKey[key].idxs.push(idx);
  });
  const iconFor = (multi, bali) => L.divIcon({
    className: "", iconSize: [24,24], iconAnchor: [12,12],
    html: `<div class="${bali ? "mk-bali" : "mk-cctv"}">${bali ? "📹" : "📷"}${multi > 1 ? `<span class="mk-n">${multi}</span>` : ""}</div>`,
  });
  const spbuIcon = L.divIcon({ className: "", html: '<div class="mk-spbu">⛽</div>', iconSize: [24,24], iconAnchor: [12,12] });
  locGroups.forEach(g => {
    const bali = g.idxs.every(i => cams[i].source === "bali");
    const m = L.marker([g.lat, g.lon], { icon: iconFor(g.idxs.length, bali) });
    m.bindPopup("");
    m.on("popupopen", async () => {
      const set = new Set(filtered().ids);
      let list = g.idxs.filter(i => set.has(i));
      if (!list.length) list = g.idxs;
      const states = {};
      list.forEach(i => { const h = statusCache[i]; if (h) states[i] = h.state; });
      m.getPopup().setContent(groupPopupHtml(g, list, states));
      const pending = list.filter(i => !(i in states));
      if (pending.length) {
        await Promise.all(pending.map(async i => { states[i] = await checkCamStatus(i); }));
        const p = m.getPopup();
        if (p && p.isOpen()) p.setContent(groupPopupHtml(g, list, states));
      }
    });
    groupMarkerByKey[g.key] = m;
  });
  spbus.forEach(s => {
    const m = L.marker([s.lat, s.lon], { icon: spbuIcon });
    m.bindPopup(spbuPopupHtml(s, {}));
    m.on("popupopen", async () => {
      const ids = spbuNearby(s).map(({ idx }) => idx);
      const states = {};
      ids.forEach(i => { const h = statusCache[i]; if (h) states[i] = h.state; });
      m.getPopup().setContent(spbuPopupHtml(s, states));
      const pending = ids.filter(i => !(i in states));
      if (pending.length) {
        await Promise.all(pending.map(async i => { states[i] = await checkCamStatus(i); }));
        const p = m.getPopup();
        if (p && p.isOpen()) p.setContent(spbuPopupHtml(s, states));
      }
    });
    spbuMarkerById[s.id] = m;
  });
  markersDirty = false;
}
// Terapkan filter header yang SAMA ke marker peta.
function syncMapToFilter() {
  if (!map || !window.L || !cams.length) return;
  ensureMarkersBuilt();
  const set = new Set(filtered().ids);
  cctvLayer.clearLayers();
  locGroups.forEach(g => {
    if (g.idxs.some(i => set.has(i))) cctvLayer.addLayer(groupMarkerByKey[g.key]);
  });
  spbuLayer.clearLayers();
  spbus.forEach(s => { const m = spbuMarkerById[s.id]; if (m) spbuLayer.addLayer(m); });
  drawRadius(false);
}
window.filterBySpbu = function(id) {
  const s = spbus.find(x => x.id === id);
  document.getElementById("spbuSel").value = id;
  document.getElementById("nearOnly").checked = false;
  // kunci daftar PERSIS seperti di popup (8 terdekat ≤1 km), bukan radius dropdown
  spbuPin = s ? { id, ids: spbuNearby(s).map(({ idx }) => idx) } : null;
  showTab("grid"); render();
  document.getElementById("grid").scrollIntoView();
};
function focusCam(idx) {
  if (!map || !window.L) return;
  const g = locGroups.find(g => g.idxs.includes(idx));
  if (!g) return;
  const m = groupMarkerByKey[g.key];
  if (!m) return;
  if (!cctvLayer.hasLayer(m)) cctvLayer.addLayer(m);
  if (cctvLayer.zoomToShowLayer) cctvLayer.zoomToShowLayer(m, () => m.openPopup());
  else { map.setView([g.lat, g.lon], 16); setTimeout(() => m.openPopup(), 300); }
}
function drawRadius(zoom = true) {
  if (!map) return;
  if (radiusCircle) { map.removeLayer(radiusCircle); radiusCircle = null; }
  const sel = spbus.find(s => s.id === document.getElementById("spbuSel").value);
  if (sel) {
    const radius = parseFloat(document.getElementById("radiusSel").value);
    radiusCircle = L.circle([sel.lat, sel.lon], { radius: radius * 1000, color: "orange", fillOpacity: 0.08 }).addTo(map);
    if (zoom) map.setView([sel.lat, sel.lon], radius <= 1 ? 14 : 13);
  }
}
function showTab(which) {
  document.getElementById("tabGrid").classList.toggle("on", which === "grid");
  document.getElementById("tabMap").classList.toggle("on", which === "map");
  document.getElementById("grid").classList.toggle("hide", which !== "grid");
  document.getElementById("mapWrap").classList.toggle("show", which === "map");
  if (which === "map") {
    if (!window.L) { setStatus("Peta butuh koneksi internet untuk memuat Leaflet/OpenStreetMap."); return; }
    initMap();
    syncMapToFilter();
    const fixSize = () => { try { map.invalidateSize(); } catch {} };
    fixSize();
    requestAnimationFrame(fixSize);
    setTimeout(() => { fixSize(); drawRadius(true); }, 120);
  }
}
// Zoom peta ke hasil pencarian (debounce; hanya saat tab peta aktif).
let fitTimer = null;
function fitMapToSearch() {
  if (!map || !window.L) return;
  if (!document.getElementById("mapWrap").classList.contains("show")) return;
  if (!norm(document.getElementById("q").value)) return;
  const { ids } = filtered();
  if (!ids.length || ids.length > 40) return;
  const pts = ids.map(i => cams[i]).filter(c => c.lat != null).map(c => [c.lat, c.lon]);
  if (!pts.length) return;
  map.flyToBounds(pts, { padding: [40, 40], maxZoom: 15, duration: 0.8 });
}
document.getElementById("tabGrid").onclick = () => showTab("grid");
document.getElementById("tabMap").onclick = () => showTab("map");

// panel filter: default terbuka di desktop, tertutup di mobile (CSS)
if (window.innerWidth > 720) {
  document.getElementById("panel").classList.add("open");
  document.getElementById("panelToggle").setAttribute("aria-expanded", "true");
}

// --- toolbar ---
document.getElementById("pinClear").onclick = () => {
  spbuPin = null;
  document.getElementById("spbuSel").value = "all";
  document.getElementById("nearOnly").checked = false;
  render(); drawRadius();
};
document.getElementById("panelToggle").onclick = () => {
  const open = document.getElementById("panel").classList.toggle("open");
  document.getElementById("panelToggle").setAttribute("aria-expanded", String(open));
};
document.getElementById("q").addEventListener("input", () => {
  render();
  clearTimeout(fitTimer);
  fitTimer = setTimeout(fitMapToSearch, 600);
});
document.getElementById("srcSel").addEventListener("change", render);
document.getElementById("spbuSel").addEventListener("change", () => { spbuPin = null; render(); drawRadius(); });
document.getElementById("radiusSel").addEventListener("change", () => { spbuPin = null; render(); drawRadius(); });
document.getElementById("nearOnly").addEventListener("change", render);
document.getElementById("refresh").onclick = load;
document.getElementById("stopAll").onclick = () => { for (const k of [...players.keys()]) { stopOne(k); restorePlaceholder(k); const b = document.querySelector(`[data-idx="${k}"] .badge`); setBadge(b, "", "IDLE"); } };
document.getElementById("playVisible").onclick = () => {
  const { ids } = filtered();
  const list = ids.slice(0, 12);
  if (ids.length > 12 && !confirm(`Ada ${ids.length} kamera tampil. Memutar banyak stream sekaligus bisa berat. Putar 12 pertama saja?`)) return;
  showTab("grid");
  list.forEach(playInto);
};
document.getElementById("checkBtn").onclick = async () => {
  const btn = document.getElementById("checkBtn");
  btn.disabled = true;
  const { ids } = filtered();
  let online = 0;
  setStatus(`Mengecek status ${ids.length} kamera…`);
  const queue = [...ids];
  async function worker() {
    while (queue.length) {
      const i = queue.shift();
      const badge = document.querySelector(`[data-idx="${i}"] .badge`);
      try {
        const r = await fetch(cams[i].hls, { cache: "no-store" });
        if (r.ok) { online++; statusCache[i] = { state: "online", t: Date.now() }; if (!players.has(i)) setBadge(badge, "ready", "READY"); }
        else { statusCache[i] = { state: "offline", t: Date.now() }; if (!players.has(i)) setBadge(badge, "off", "OFFLINE"); }
      } catch { statusCache[i] = { state: "offline", t: Date.now() }; if (!players.has(i)) setBadge(badge, "off", "OFFLINE"); }
    }
  }
  await Promise.all(Array.from({ length: 6 }, worker));
  setStatus(`Pengecekan selesai: ${online}/${ids.length} online.`);
  btn.disabled = false;
};

load();
</script>
